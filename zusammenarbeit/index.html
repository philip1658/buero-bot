<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Büro-Bot · Anmeldung</title>
<style>
:root{--bg:#f6f5f2;--karte:#fff;--text:#1d1d1b;--leise:#6b6a66;--rand:#dddad3;--akzent:#1f5c4a;--fehler:#a33}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--karte:#21211f;--text:#eceae5;--leise:#9b9993;--rand:#3a3935;--akzent:#5fb394;--fehler:#e57373}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:340px;background:var(--karte);border:1px solid var(--rand);border-radius:12px;padding:28px 24px;display:none}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 20px;color:var(--leise);font-size:14px}
label{display:block;font-size:13px;color:var(--leise);margin:0 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--rand);border-radius:8px;background:var(--bg);color:var(--text);margin:0 0 14px}
input:focus{outline:2px solid var(--akzent);outline-offset:1px}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--akzent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#meldung{min-height:20px;margin:12px 0 0;font-size:14px;color:var(--fehler)}
.merken{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--leise);margin:-4px 0 16px}.merken input{width:auto;margin:0}
</style></head><body>
<form id="f" autocomplete="on">
<h1>Büro-Bot</h1><p>Bitte anmelden.</p>
<label for="u">Benutzername</label><input id="u" name="username" autocomplete="username" autocapitalize="none" required>
<label for="p">Passwort</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<label class="merken"><input id="m" type="checkbox" checked> Angemeldet bleiben</label>
<button id="b">Anmelden</button><div id="meldung" role="alert"></div>
</form>

const ab=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById("f"),meldung=document.getElementById("meldung"),knopf=document.getElementById("b");
const lies=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const schreib=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
async function oeffne(roh){
  const k=await crypto.subtle.importKey("raw",roh,"AES-GCM",false,["decrypt"]);
  const klar=await crypto.subtle.decrypt({name:"AES-GCM",iv:ab(IV)},k,ab(DATEN));
  const abm='<script>addEventListener("hashchange",()=>{if(location.hash==="#abmelden"){try{localStorage.removeItem("'+KEY+'");sessionStorage.removeItem("'+KEY+'")}catch(e){}location.reload()}})<\/script>';
  let html=new TextDecoder().decode(klar);
  html=html.includes("</body>")?html.replace("</body>",abm+"</body>"):html+abm;
  document.open();document.write(html);document.close();
  const t=html.match(/<title>([^<]*)<[/]title>/i);if(t){const x=document.createElement("textarea");x.innerHTML=t[1];document.title=x.value}
}
async function ableiten(u,p){
  const enc=new TextEncoder();
  const salz=new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode(SALZ_TEXT))).slice(0,16);
  const basis=await crypto.subtle.importKey("raw",enc.encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:salz,iterations:ITER},basis,256));
}

const gemerkt=lies(KEY)||(()=>{try{return sessionStorage.getItem(KEY)}catch(e){return null}})();

f.addEventListener("submit",async ev=>{
  ev.preventDefault();meldung.textContent="";knopf.disabled=true;knopf.textContent="Prüfe …";
  try{
